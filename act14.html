<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Personal Details</title>
</head>
<body>

    <h1> Personal Details Form</h1>
    <p>Please fill in your personal details.</p>
    <hr>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Your Name</label><br>
            <input type="text" id="name" placeholder="Enter your full name"><br><br>

            <label>Email</label><br>
            <input type="email" id="email" placeholder="Enter your email"><br><br>

            <label>Phone Number</label><br>
            <input type="tel" id="phone" placeholder="Enter your phone number"><br><br>

            <label>Date of Birth</label><br>
            <input type="date" id="dob"><br><br>

            <label>Gender</label><br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other<br><br>

            <label>Address</label><br>
            <textarea id="address" rows="3" cols="35" placeholder="Enter your address"></textarea>

        </fieldset>

        <br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
