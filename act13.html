<!DOCTYPE html>
<html>
<head>
    <title>Semantic vs Non-Semantic HTML</title>
</head>
<body>

    <!-- Non-semantic (no meaning) -->
    <div>
        <div>My Website</div>
        <div>Home | About | Contact</div>
    </div>

    <!-- Semantic (meaningful) -->
    <header>
        <h1>My Website</h1>
        <nav>Home | About | Contact</nav>
    </header>

</body>
</html>
