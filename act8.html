<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

<h2>Ordered List</h2>
<ol>
    <li>Wake up</li>
    <li>Have breakfast</li>
    <li>Go to school</li>
</ol>

<h2>Unordered List</h2>
<ul>
    <li>Reading</li>
    <li>Gaming</li>
    <li>Coding</li>
</ul>

<h2>Description List</h2>
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
</dl>

</body>
</html>
